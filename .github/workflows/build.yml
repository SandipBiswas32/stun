name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o axe-stun-mod.zip
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build
        working-directory: axe-stun-mod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: axe-stun-mod
          path: axe-stun-mod/build/libs/*.jar
